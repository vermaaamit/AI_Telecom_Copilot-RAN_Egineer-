# ============================================================
# SonarQube & SonarCloud Configuration Properties
# AI Telecom Copilot – RAN Engineer
# ============================================================

sonar.projectKey=ai-telecom-copilot-ran
sonar.projectName=AI Telecom Copilot - RAN Engineer
sonar.projectVersion=1.0.0

# Source and Test directories
sonar.sources=ranengineer/backend/app,ranengineer/frontend/src
sonar.tests=ranengineer/backend/tests

# Encodings
sonar.sourceEncoding=UTF-8

# Python Coverage Report (generated by pytest-cov)
sonar.python.version=3.12
sonar.python.coverage.reportPaths=ranengineer/backend/coverage.xml

# Exclusions
sonar.exclusions=**/node_modules/**,**/.next/**,**/__pycache__/**,**/coverage.xml,**/dist/**,**/build/**
sonar.test.inclusions=**/*test*.py,**/tests/**

# Quality Gate
sonar.qualitygate.wait=true

