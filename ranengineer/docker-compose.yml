services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://ranengineer:${POSTGRES_PASSWORD:-ranengineer-dev-only}@postgres:5432/ranengineer
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./configs:/configs
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started


  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ranengineer
      POSTGRES_USER: ranengineer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ranengineer-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ranengineer -d ranengineer"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine

volumes:
  postgres_data:
