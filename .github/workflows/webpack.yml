name: Frontend CI

on:
  push:
    branches: ["main"]
    paths:
      - "ranengineer/frontend/**"
      - ".github/workflows/webpack.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "ranengineer/frontend/**"
      - ".github/workflows/webpack.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ranengineer/frontend

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ranengineer/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint app
        run: npm run lint

      - name: Build app
        run: npm run build
